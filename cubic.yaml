# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
# cubic reviews every pull request; CodeRabbit reviews the ones labeled deep-review (.coderabbit.yaml).
# cubic reads this file from the default branch only, and falls back to its web settings when the
# file is invalid.
version: 1
reviews:
  enabled: true
  # Each finding is a thread to resolve before merging.
  sensitivity: low
  incremental_commits: true
  check_drafts: false
  ignore:
    files:
      - docs/images/**
  custom_rules:
    - name: Hit every surface
      description: >-
        A configuration change has to reach every surface in the "Hit every surface" list of
        AGENTS.md: decoding (a coding key and stablebar.schema.json), layers (includes, templates,
        profiles, package overrides), editing (the Settings sections and ConfigurationEdits.swift),
        and the docs page and examples. Point out any surface this change leaves out.
      include:
        - Sources/**
    - name: Tests
      description: >-
        Most tests run on the main actor, in parallel. A test that bounds main-actor scheduling
        with wall-clock time (short sleeps, deadline loops, short timeouts) fails at random on CI:
        suggest waiting by counting polls instead. A sleep that only checks that nothing happens is
        fine. A fixture that runs git needs a timeout of 60 seconds or more. A purely visual fix is
        proven with before/after images, so don't ask for a UI test.
      include:
        - Tests/**
    - name: Docs and examples
      description: >-
        docs/ is the user manual. Point out instructions that this pull request's code contradicts,
        and examples that would no longer load. Keep the README short.
      include:
        - docs/**
        - examples/**
    - name: Workflow safety
      description: >-
        Jobs triggered by pull_request_target or workflow_run must never check out or run the pull
        request's code, and no workflow may put a pull request's title, description or branch name
        into a shell command. Point out any step that does.
      include:
        - .github/workflows/**
    - name: Comments
      description: >-
        Comments follow "Writing comments" in AGENTS.md. Point out a comment this pull request adds
        or changes that tells the story of the bug, the issue or the fix instead of saying what the
        code does or why it must be so, one that repeats the code or restates a signature, one longer
        than it needs to be, and an issue or pull request number given in place of an explanation.
        Suggest the shorter comment.
      include:
        - "**/*.swift"
        - "**/*.sh"
        - "**/*.mjs"
        - .github/scripts/*.mjs
pr_descriptions:
  # The Description check reads the description's last line, so cubic leaves it alone.
  generate: false
  cubic_review_link: false
issues:
  # Authors fix review comments themselves; with auto-fix off, cubic pushes no commits on its own and
  # adds no auto-fix button to descriptions.
  auto_fix: "off"
