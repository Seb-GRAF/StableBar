# Blank issues stay available: the triage skill's prefilled new-issue links rely on them.
blank_issues_enabled: true
contact_links:
  - name: Configuration help
    url: https://github.com/stablebox/StableBar/blob/main/docs/README.md
    about: The user guide documents almost every configuration option, and examples/ holds working setups.
  - name: Ask a question
    url: https://github.com/stablebox/StableBar/discussions/categories/q-a
