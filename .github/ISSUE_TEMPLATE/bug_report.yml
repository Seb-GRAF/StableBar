name: Bug report
description: StableBar crashes, shows something wrong, or behaves differently from the user guide.
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Search [open and closed issues](https://github.com/stablebox/StableBar/issues?q=is%3Aissue) first, and keep the report to one problem. Redact tokens, keys and personal details from configuration and logs.

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you see, including any error text.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. Add this widget to the configuration: ...
        2. Connect an external display
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen instead, and the section of the user guide that describes it, if there is one.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the report from Settings → Status → Report a problem → Copy bug report, or from `stablebar --report`, in place of these lines. If StableBar doesn't open, Finder shows its version under Get Info for StableBar.app. If you built it yourself, give the commit.
      value: |
        StableBar:
        macOS:
        Displays (how many, which have a notch):
        AeroSpace or yabai version, if you use one:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The relevant part of your configuration, script output, error text or logs. If StableBar quit unexpectedly, paste the report from Settings → Status → Crashes → Copy report. For a problem with how the bar looks or where widgets sit, add a bar link if your bar's menu has Share My Bar… (releases after 0.17.0). Check What it shares, then use Copy Link. It leaves out script widgets, custom providers and profiles. Drag screenshots or recordings in here.

  - type: textarea
    id: related
    attributes:
      label: Related
      description: Similar issues or pull requests you found, and how this differs.
