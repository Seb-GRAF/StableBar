body:
  - type: markdown
    attributes:
      value: |
        An idea here can grow into a [feature request](https://github.com/stablebox/StableBar/issues/new?template=feature_request.yml) once it's clear what StableBar should do. Search [issues](https://github.com/stablebox/StableBar/issues?q=is%3Aissue) and [discussions](https://github.com/stablebox/StableBar/discussions) first: closed issues include declined requests and their reasons.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What StableBar could do about it. Sketches and screenshots of other apps help.
