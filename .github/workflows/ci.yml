name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: stable
        options:
          - stable
          - beta

permissions:
  contents: read

# A stable release gets its own group, so a newer push can't cancel it while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && 'stable' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  current:
    name: Check revision
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.revision.outputs.build }}
      app: ${{ steps.changes.outputs.app }}
      packaging: ${{ steps.changes.outputs.packaging }}
      screens: ${{ steps.changes.outputs.screens }}
      site: ${{ steps.changes.outputs.site }}
    steps:
      - name: Skip superseded pushes
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this push because main has moved on."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      # A pull request compiles the release and draws the docs images only when it changes what they
      # build from: the files scripts/unchanged-app.sh compares, or this workflow. Packaging reads
      # only the scripts and resources. The before/after screens are drawn when the app, the scenes,
      # the examples they read or the comparison change, and the website's when the website or its
      # capture change.
      # HEAD merges the pull request into its base, HEAD^.
      - name: Find what the pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^ HEAD)
          if grep -qE '^(Sources/|Resources/|Package\.(swift|resolved)$|scripts/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(Resources/|scripts/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(Sources/|Resources/|Package\.(swift|resolved)$|scripts/|scenes/|examples/|\.github/workflows/ci\.yml$|\.github/scripts/(png|compare-screens)\.mjs$)' <<< "$changed"; then
            echo "screens=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(site/|\.github/workflows/ci\.yml$|\.github/scripts/(png|compare-screens|capture-site)\.mjs$)' <<< "$changed"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: current
    if: needs.current.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Parses each script with the shell its first line names, without running it.
      - name: Check script syntax
        shell: zsh -e {0}
        run: |
          for script in scripts/*.sh examples/**/*.sh; do
            interpreter=$(sed -n '1s/^#!//p' $script)
            $interpreter -n $script
          done
      - name: Identify Swift toolchain
        id: swift
        run: echo "version=$({ swift --version; xcodebuild -version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Build
        run: |
          swift --version
          swift build --build-tests
      - name: Test
        run: swift test --skip-build

  # Runs on main, and on pull requests that change the app, so a release-only failure shows up
  # before it merges and leaves main without a beta. Pull requests that draw screens use it too.
  build:
    name: Build release
    needs: current
    if: needs.current.outputs.build == 'true' && (github.ref == 'refs/heads/main' || needs.current.outputs.app == 'true' || needs.current.outputs.screens == 'true')
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Identify Swift toolchain
        id: swift
        run: echo "version=$({ swift --version; xcodebuild -version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Compile release
        run: swift build -c release --disable-keychain
      # Pull requests start from main's cache and save none of their own, so they don't push main's
      # out of the repository's 10 GB.
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Archive release binary
        run: tar -cf release-build.tar -C .build/release StableBar Sparkle.framework -C "$GITHUB_WORKSPACE/.build/artifacts/sparkle/Sparkle" bin
      - uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: release-build.tar
          retention-days: 1

  # Draws the images in docs/images from each push to main, and from pull requests that change the
  # app, so a broken render shows up before a stable release needs it. The release commits them
  # beside CHANGELOG.md.
  docs-images:
    name: Docs images
    env:
      STABLEBAR_PREBUILT_DIR: release-build
    needs: [current, build]
    if: github.ref == 'refs/heads/main' || needs.current.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-build
      - name: Extract release binary
        run: |
          mkdir release-build
          tar -xf release-build.tar -C release-build
      - name: Render
        run: |
          brew install webp
          ./scripts/render-docs-images.sh
      - uses: actions/upload-artifact@v7
        with:
          name: docs-images
          path: docs/images/*.webp
          retention-days: 1

  # Builds the DMG as the beta does, for pull requests that change the scripts, resources or this
  # workflow. Pull requests get no Developer ID, so the app is ad-hoc signed; only the beta and
  # release jobs sign and notarize.
  package:
    name: Package
    env:
      STABLEBAR_PREBUILT_DIR: release-build
      VERSION: 0.0.0-pr.${{ github.event.pull_request.number }}
    needs: [current, build]
    if: github.event_name == 'pull_request' && needs.current.outputs.packaging == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-build
      - name: Extract release binary
        run: |
          mkdir release-build
          tar -xf release-build.tar -C release-build
      - name: Build the installer
        run: |
          brew install create-dmg
          ./scripts/set-version.sh "$VERSION" "$GITHUB_RUN_NUMBER"
          STABLEBAR_RELEASE_BUILD=1 ./scripts/package.sh
      - name: Check the installer
        run: |
          hdiutil verify dist/StableBar.dmg
          volume=$(mktemp -d)
          hdiutil attach dist/StableBar.dmg -nobrowse -readonly -mountpoint "$volume"
          app="$volume/StableBar.app"
          codesign --verify --deep --strict "$app"
          stamped="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$app/Contents/Info.plist" | paste -sd ' ' -)"
          if [[ "$stamped" != "$VERSION $GITHUB_RUN_NUMBER" ]]; then
            echo "::error::The app is version $stamped, not $VERSION $GITHUB_RUN_NUMBER."
            exit 1
          fi
          "$app/Contents/MacOS/StableBar" --validate Resources/config.json

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$FROM" --to "$TO" --verbose
      - name: Lint pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose

  # Tests the scripts in .github/scripts: the Linked issue and Description checks, and the
  # before/after screens. The checks and the screens comment run from the default branch
  # (pull-request-checks.yml, screens.yml), so a change to them is tested here before it merges.
  pull-request-checks:
    name: Test pull request checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test .github/scripts/*.test.mjs

  # Draws the docs images and the scenes with the pull request's app and with its base's, and
  # compares them into the screens-app artifact. Both draw the pull request's scenes, each beside
  # its own resources and examples. This job runs the pull request's code with a read-only token:
  # screens.yml, which runs from the default branch, posts the comparison and the Visual review
  # status.
  screens:
    name: Draw screens
    env:
      STABLEBAR_PREBUILT_DIR: release-build
    needs: [current, build]
    if: github.event_name == 'pull_request' && needs.current.outputs.screens == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: release-build
      # The scenes and the comparison scripts are kept aside before the checkout moves to the base.
      # A scene that fails to draw is reported in scenes.json, and later in the comparison.
      - name: Draw the pull request's screens
        timeout-minutes: 10
        run: |
          mkdir release-build
          tar -xf release-build.tar -C release-build
          ./scripts/build.sh "$RUNNER_TEMP/head.app"
          app="$RUNNER_TEMP/head.app/Contents/MacOS/StableBar"
          "$app" --render-docs-images "$RUNNER_TEMP/after/docs"
          "$app" --render-scenes "$RUNNER_TEMP/after/scenes" scenes || [[ -f "$RUNNER_TEMP/after/scenes/scenes.json" ]]
          cp -R scenes "$RUNNER_TEMP/scenes"
          cp -R .github/scripts "$RUNNER_TEMP/scripts"
      - name: Check out the base
        run: |
          git checkout --quiet --detach HEAD^
          rm -rf scenes
          cp -R "$RUNNER_TEMP/scenes" scenes
      - name: Identify Swift toolchain
        if: needs.current.outputs.app == 'true'
        id: swift
        run: echo "version=$({ swift --version; xcodebuild -version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        if: needs.current.outputs.app == 'true'
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      # When the app didn't change, the pull request's app draws the base too, and the docs images
      # are the same. A base that can't draw scenes leaves no scenes.json; the comparison says so.
      - name: Draw the base's screens
        timeout-minutes: 15
        env:
          APP: ${{ needs.current.outputs.app }}
        run: |
          mkdir -p "$RUNNER_TEMP/before"
          if [[ "$APP" == true ]]; then
            STABLEBAR_PREBUILT_DIR= ./scripts/build.sh "$RUNNER_TEMP/base.app"
            app="$RUNNER_TEMP/base.app/Contents/MacOS/StableBar"
            "$app" --render-docs-images "$RUNNER_TEMP/before/docs"
          else
            app="$RUNNER_TEMP/head.app/Contents/MacOS/StableBar"
            cp -R "$RUNNER_TEMP/after/docs" "$RUNNER_TEMP/before/docs"
          fi
          "$app" --render-scenes "$RUNNER_TEMP/before/scenes" scenes || true
      - name: Compare
        run: |
          compare="$RUNNER_TEMP/scripts/compare-screens.mjs"
          node "$compare" "$RUNNER_TEMP/before/docs" "$RUNNER_TEMP/after/docs" "$RUNNER_TEMP/out" --prefix docs
          node "$compare" "$RUNNER_TEMP/before/scenes" "$RUNNER_TEMP/after/scenes" "$RUNNER_TEMP/out" --prefix scenes \
            --before-report "$RUNNER_TEMP/before/scenes/scenes.json" --after-report "$RUNNER_TEMP/after/scenes/scenes.json"
      - uses: actions/upload-artifact@v7
        with:
          name: screens-app
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  # Captures the website's pages from the pull request and from its base, and compares them into
  # the screens-site artifact, for screens.yml as above.
  site-screens:
    name: Draw website screens
    needs: current
    if: github.event_name == 'pull_request' && needs.current.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Playwright
        working-directory: ${{ runner.temp }}
        run: |
          mkdir playwright
          cd playwright
          npm init --yes > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Capture the website
        run: |
          mkdir "$RUNNER_TEMP/base"
          git archive HEAD^ site | tar -x -C "$RUNNER_TEMP/base"
          capture="$GITHUB_WORKSPACE/.github/scripts/capture-site.mjs"
          cd "$RUNNER_TEMP/playwright"
          node "$capture" "$RUNNER_TEMP/base/site" "$RUNNER_TEMP/before"
          node "$capture" "$GITHUB_WORKSPACE/site" "$RUNNER_TEMP/after"
      - name: Compare
        run: node .github/scripts/compare-screens.mjs "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" "$RUNNER_TEMP/out" --prefix site
      - uses: actions/upload-artifact@v7
        with:
          name: screens-site
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  # Every push to main with releasable commits publishes the next version as a beta prerelease,
  # unless it would ship the same app as the beta before it. It commits nothing. Both jobs build
  # with github.run_number, which only goes up, so a stable build always numbers higher than the
  # betas before it. The count belongs to this workflow file: keep both jobs here, and don't
  # rename it.
  #
  # The dry run writes the next version to .next-version. It writes nothing when there is nothing
  # to release, or when main moved on during this run; the newer push builds its own beta.
  beta:
    name: Beta
    env:
      STABLEBAR_PREBUILT_DIR: release-build
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'beta'))
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - name: Find the next version
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if release=$(./scripts/unchanged-app.sh); then
            echo "No beta: the commits since $release change only docs, CI or tests."
            exit 0
          fi
          npx semantic-release --dry-run
          if [[ -f .next-version ]]; then
            echo "version=$(cat .next-version)-beta.$(date -u +%Y%m%d%H%M%S).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "No beta: nothing to release since the last stable version, or main moved on."
          fi
      - uses: actions/download-artifact@v8
        if: steps.next.outputs.version
        with:
          name: release-build
      - name: Extract release binary
        if: steps.next.outputs.version
        run: |
          mkdir release-build
          tar -xf release-build.tar -C release-build
      - name: Set up Developer ID signing
        if: steps.next.outputs.version
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ vars.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ vars.NOTARY_API_ISSUER }}
        run: ./scripts/import-developer-id.sh
      - name: Build the beta
        if: steps.next.outputs.version
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          brew install create-dmg
          ./scripts/set-version.sh "$VERSION" "$GITHUB_RUN_NUMBER"
          STABLEBAR_RELEASE_BUILD=1 ./scripts/package.sh
      - name: Publish the beta
        if: steps.next.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/StableBar.dmg --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
      # Only a Developer ID-signed app can install an update, so ad-hoc builds stay out of the feed.
      - name: Publish the update feed
        if: steps.next.outputs.version && env.SIGNING_IDENTITY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: ./scripts/publish-appcast.sh "$VERSION" beta

  # Run by hand from Actions > CI > Run workflow on main.
  release:
    name: Release
    env:
      STABLEBAR_PREBUILT_DIR: release-build
    needs: [test, build, docs-images]
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN can't bypass branch rules on main; the release app can. Configure it with
      # the RELEASE_APP_CLIENT_ID variable and the RELEASE_APP_PRIVATE_KEY secret.
      - name: Create release app token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Stable ships only an app that beta users already ran: this commit's beta, or the beta
      # before commits that change only docs, CI or tests. A stable tag on this commit means a
      # release failed after pushing its tag; this run finishes its GitHub release and feed item.
      - name: Require a beta of this app
        id: tags
        run: |
          stable=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [[ -n "$stable" ]]; then
            echo "${stable#v}" > .next-version
            echo "finish=${stable#v}" >> "$GITHUB_OUTPUT"
            echo "Finishing $stable."
            exit 0
          fi
          beta=$(git tag --points-at HEAD --list 'v*-beta.*')
          if [[ -n "$beta" ]]; then
            echo "Releasing the commit that shipped as $beta."
          elif release=$(./scripts/unchanged-app.sh) && [[ "$release" == *-beta.* ]]; then
            echo "Releasing the app that shipped as $release; the commits since change only docs, CI" \
              "or tests."
          else
            echo "::error::The newest commit on main, $GITHUB_SHA, has no beta. Its beta may still be" \
              "building, or it has nothing to release."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - uses: actions/download-artifact@v8
        with:
          name: release-build
      - name: Extract release binary
        run: |
          mkdir release-build
          tar -xf release-build.tar -C release-build
      - uses: actions/download-artifact@v8
        with:
          name: docs-images
          path: docs/images
      - name: Set up Developer ID signing
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ vars.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ vars.NOTARY_API_ISSUER }}
        run: ./scripts/import-developer-id.sh
      - name: Release
        if: steps.tags.outputs.finish == ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          brew install create-dmg
          npx semantic-release
      # The commit already carries the version, and its message carries the release notes.
      # @semantic-release/github uploads to a draft release and publishes it once the DMG is in.
      # A DMG the release already has is reused, so people never get two builds of one version.
      - name: Finish the release
        if: steps.tags.outputs.finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tags.outputs.finish }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx StableBar.dmg; then
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern StableBar.dmg --dir dist
          else
            brew install create-dmg
            STABLEBAR_RELEASE_BUILD=1 ./scripts/package.sh
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "v$VERSION" dist/StableBar.dmg --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "v$VERSION" dist/StableBar.dmg --repo "$GITHUB_REPOSITORY" --verify-tag \
                --title "v$VERSION" --notes "$(git log -1 --format=%b)"
            fi
          fi
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
      # semantic-release exits successfully without releasing when main moved during this run or
      # there was nothing to release. Don't let that look like a release.
      - name: Require a stable tag
        run: |
          if ! git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Nothing was released: main moved during this run, or there was nothing" \
              "to release. Run it again once the newest commit's beta is out."
            exit 1
          fi
      # The release commit points the website's downloads at this version's DMG, but it skips CI,
      # so the website deploys only now that the release is out.
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Publish the update feed
        if: env.SIGNING_IDENTITY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-appcast.sh "$(cat .next-version)"
      - name: Update the Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version=$(cat .next-version)
          git clone --depth 1 "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/Seb-GRAF/homebrew-tap.git" tap
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$(shasum -a 256 dist/StableBar.dmg | cut -d ' ' -f 1)\"/" tap/Casks/stablebar.rb
          git -C tap -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -am "stablebar $version"
          git -C tap push
