name: Deep review

# Adds the deep-review label, which starts a CodeRabbit review, and every hour asks CodeRabbit again
# where its review limit held a review back. pull_request_target runs the default branch's copy of
# this workflow and of .github/scripts, so a pull request never runs its own code here. The logic and
# its tests are in .github/scripts/deep-review.mjs.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deep-review-${{ github.event.pull_request.number }}
  # A retry run that stopped between removing and adding the label would leave the label off.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  label:
    name: Deep review label
    if: >-
      github.event_name == 'pull_request_target' && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'deep-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { needsDeepReview } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deep-review.mjs`);
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const paths = files.flatMap((file) => file.previous_filename ? [file.filename, file.previous_filename] : [file.filename]);
            if (needsDeepReview(paths, pr.additions + pr.deletions))
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["deep-review"] });

  retry:
    name: Ask CodeRabbit again
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { needsRetry } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deep-review.mjs`);
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", sort: "created", direction: "asc", per_page: 100 });
            // CodeRabbit allows each pull request author two reviews an hour; the oldest go first.
            const asked = new Map();
            for (const pr of pulls.filter((pr) => !pr.draft && pr.labels.some((label) => label.name === "deep-review"))) {
              if (asked.get(pr.user.login) === 2) continue;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              if (!needsRetry({ headSha: pr.head.sha, comments, now: Date.now() })) continue;
              asked.set(pr.user.login, (asked.get(pr.user.login) ?? 0) + 1);
              core.info(`Asking CodeRabbit again on #${pr.number}.`);
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "deep-review" });
              } finally {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["deep-review"] });
              }
            }
